{% extends 'base.html' %}

{% block title %}AgroVision — Connexion{% endblock %}

{% block content %}

<link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">

<div class="login-page">
  <div class="login-wrapper">

      <div class="login-logo">
          <span>Agro<em>Vision</em></span>
      </div>

      <div class="login-card">
          <h1>Connexion</h1>
          <p class="subtitle">Accédez à votre espace de suivi agricole.</p>

          <form action="/login" method="post">

              <div class="form-group">
                  <label for="email">Adresse e-mail</label>
                  <input type="email" id="email" name="email" placeholder="vous@exemple.com" required>
              </div>

              <div class="form-group">
                  <label for="password">Mot de passe</label>
                  <input type="password" id="password" name="password" placeholder="Votre mot de passe" required>
              </div>

              <div class="form-options">
                  <label class="remember">
                      <input type="checkbox" name="remember">
                      Se souvenir de moi
                  </label>
                  <a href="/reset-password" class="forgot-link">Mot de passe oublié ?</a>
              </div>

              <button type="submit" class="btn-submit">Se connecter</button>

          </form>

          <p class="register-row">
              Pas encore de compte ? <a href="/register">Créer un compte</a>
          </p>
      </div>

  </div>
</div>

{% endblock %}
