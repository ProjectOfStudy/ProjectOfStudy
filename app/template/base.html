<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AgroVision{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <nav class="navbar">
        <a href="{{ url_for('main.index') }}" class="nav-logo">🌾 AgroVision</a>
        <ul class="nav-links">
            <li><a href="{{ url_for('main.index') }}">Accueil</a></li>
            <li><a href="{{ url_for('parcelles.list') }}">Parcelles</a></li>
            <li><a href="{{ url_for('alertes.liste') }}">Alertes</a></li>
            <li><a href="{{ url_for('observations.liste') }}">Observations</a></li>
            <li><a href="{{ url_for('dashboard.dashboard') }}" class="nav-cta">Tableau de bord</a></li>
            
        </ul>
    </nav>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <p>© 2025 AgroVision — Projet d'études Bachelor 2 — Sup de Vinci</p>
    </footer>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
